version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: doud-ems-anythingllm_web_1
      APP_PORT: 3001
      PROXY_AUTH_ADD: "false"

  web:
    image: mintplexlabs/anythingllm:latest
    restart: on-failure
    cap_add:
      - SYS_ADMIN
    environment:
      STORAGE_DIR: /app/server/storage
      SERVER_PORT: 3001
    volumes:
      - ${APP_DATA_DIR}/data/storage:/app/server/storage
      - ${APP_DATA_DIR}/data/hotdir:/app/collector/hotdir
      - ${APP_DATA_DIR}/data/outputs:/app/collector/outputs
