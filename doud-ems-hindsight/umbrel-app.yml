# Manifeste d'app umbrelOS 2.0 — Hindsight (Vectorize)
# Carte kanban t_7cbeec54. Ordre des champs = ordre canonique de la doc de
# packaging officielle (getumbrel/umbrel-apps, .agents/skills/umbrel-package-app).
manifestVersion: 1

id: doud-ems-hindsight

# umbrelOS 2.0 : le dossier de données racine est déclaré ici et monté dans
# le compose via ${APP_DATA_DIR}/data. Ne pas le retirer — sur 2.0, umbreld
# exige ce champ pour placer l'état de l'app dans son dossier de sauvegarde.
storage:
  dataRoot: data

category: ai

name: Hindsight

# Version = version de release upstream (v1.2.3, 19/11/2026) et version du tag
# d'image. Jamais « latest » : umbrelOS s'en sert pour détecter les mises à
# jour, et « latest » rend l'installation non reproductible.
version: "1.2.3"

tagline: Mémoire long terme pour agents IA — API, Control Plane et MCP

description: >-
  Hindsight donne une mémoire persistante à vos agents : il extrait des faits
  des conversations, les consolide et les restitue par recherche sémantique.


  Trois surfaces dans une seule app :

  • Control Plane (cette interface web, port 9999) pour créer et inspecter les
  banques de mémoire ;

  • API HTTP sur le port 8888 (REST + MCP sur /mcp/{bank_id}) pour brancher
  Hermes, Claude, Cursor ou n'importe quel client MCP ;

  • PostgreSQL embarqué (pg0 + pgvector) dans le dossier de données de l'app.


  Au premier lancement, aucune clé LLM n'est configurée : l'app démarre en mode
  dégradé (stockage de chunks, recherche fonctionnelle, extraction de faits et
  réflexion désactivées). Pour activer l'extraction de faits, renseignez
  HINDSIGHT_API_LLM_API_KEY (et éventuellement PROVIDER / MODEL / BASE_URL) dans
  les réglages d'environnement de l'app, puis redémarrez-la.


  L'API est protégée par une clé dérivée de l'installation ; la commande pour la
  lire est dans le README du dépôt.

# Notes extraites des listes de PR générées par upstream pour v1.2.2 et v1.2.3
# (corps des releases GitHub, relevé le 20/11/2026), filtrées sur ce qui se voit
# depuis un serveur auto-hébergé. Ce n'est pas un changelog rédigé par upstream :
# seuls les titres de PR sont publics. La 1.2.2 est incluse parce que ce paquet
# passe directement de la 1.2.1 à la 1.2.3.
releaseNotes: >-
  ## v1.2.3 (19 novembre 2026)

  - Ingestion de documents : les fichiers impairs, corrompus ou très gros ne font plus échouer l'opération, ne bouclent plus en ré-essais et ne saturent plus la mémoire.

  - Hermes : nouveau réglage `reflect_budget`, pour garder un reflect court alors que le recall reste à un budget moyen.

  - Plugin Hermes : les exécutions cron n'appellent plus l'auto-recall, et les workers kanban lisent la mémoire sans y écrire.

  - Control Plane : `/api/graph` n'est plus compressé deux fois (correction liée à Next 16.4.6).

  ## v1.2.2 (19 novembre 2026)

  - Knowledge banks : ingestion plus rapide, recherche à budget de tokens, un index vectoriel par banque au lieu d'un index partagé, découpage audio/vidéo par PyAV (plus besoin d'un ffmpeg système).

  - Réglage de la recherche : rerank de la recherche knowledge via tout endpoint compatible Cohere `/rerank`, y compris avec une image comme requête.

  - Image « full » : EmbeddingGemma 2 est désormais embarqué dans l'image (plus de téléchargement au premier usage).

  - Base de données : `pg0-embedded` monté en 0.17.0.

  - Fiabilité : un compte-rendu de worker refusé ne consomme plus un ré-essai, et une tâche ne se diffère plus indéfiniment (plafond à 180 tentatives) ; correctifs de consolidation, d'observation tree et de webhooks (`mental_model.refreshed`).

  - Dépendances : Next.js 16.4.6 et correctifs CVE (dnspython 2.9.2, soupsieve 4.1.2).

  ## v1.2.1 (10 novembre 2026)

  - Base de données : les migrations du schéma de base s'appliquent au démarrage même quand l'extension de tenant (celle qui porte la clé d'API, ici `ApiKeyTenantExtension`) ne les déclare pas — c'est exactement la configuration de cette app.

  - Arrêt propre : SIGTERM cesse immédiatement de réclamer des tâches et le drainage tient dans le délai de grâce.

  - Local models : les loaders ONNX ne bouclent plus au démarrage à côté d'un build de modèle local.

  - Recall : repli optionnel sur le reranker quand le modèle de décision échoue, et embedders distincts pour la requête et le passage.

  - Control Plane : bascules par banque pour « prune » et « dedup » du recall ; ré-indexation d'un schéma avec un nouveau modèle d'embedding sans arrêter les serveurs.

  - API documents : `add_tags` / `remove_tags` sur le PATCH. « Knowledge Pages » devient « Pages » (anciens noms dépréciés jusqu'à la 2.x).

  - Plugin Hermes : ne réécrit plus les mémoires d'une session à chaque ajout, réessaie un recall sur une connexion keep-alive périmée, accepte les clients 1.x.

  - Correctifs : une banque supprimée ne se recrée plus via ses jobs en cours ; clone / import / renommage ne peuvent plus prendre un alias existant ; les résultats MCP multi-banques ne sont plus envoyés en double ; les pièces jointes des retains échoués sont nettoyées ; perfs recall et consolidation.

  ## v1.2.0 (3 novembre 2026)

  - LLM : tous les appels d'outils passent désormais par un schéma de réponse, l'appel d'outils natif est abandonné. Reranker par défaut `hindsight-ai/hs-rerank-1` ; fournisseur « decision model » hébergé en option.

  - Démarrage plus robuste : la sonde LLM au boot est bornée (un backend lent ne bloque plus le démarrage) et un LLM non connecté n'empêche plus le serveur de démarrer — il est sauté par le failover. Mode dégradé sans clé préservé.

  - Base de données : une `HINDSIGHT_API_DATABASE_URL` fournie par l'utilisateur n'est plus remplacée par le PostgreSQL embarqué (pg0) ; `asyncpg >= 0.32` requis pour qu'une connexion perdue ne bloque plus le worker.

  - Arrêt : l'API a 60 s pour rendre ses tâches en cours.

  - Mémoire : une observation plus ancienne n'écrase plus un amendement plus récent du même jour ; index BM25 reconstruit à la réécriture des observations ; evidence des pages jusqu'à un budget de tokens.

  - Journal des appels LLM dans le Control Plane : durée de rétention, graphe horaire sur 24 h, répartition par modèle et par opération.

  - Intégrations : les outils Hindsight sont exposés à l'agent sur sa propre banque, et les sessions cron / heartbeat / subagent peuvent utiliser la mémoire (opt-in).

developer: Vectorize

website: https://hindsight.vectorize.io

# Aucune dépendance : l'app est autonome (base PostgreSQL embarquée), elle ne
# requiert ni Bitcoin ni une autre app du store.
dependencies: []

repo: https://github.com/vectorize-io/hindsight
support: https://github.com/vectorize-io/hindsight/issues

# Port public de l'app (ingress umbrelOS → app_proxy → Control Plane :9999).
# 9999 était déjà le port de Hindsight avant sa désinstallation : il est libre.
# Vérifié non conflictuel avec les autres apps de ce store : anythingllm=3001,
# zennotes=7878. Le port 8888 (API/MCP) est publié directement par le compose,
# hors ingress : il n'apparaît donc pas ici — un manifeste umbrel n'accepte
# qu'un seul port public.
port: 9999

# Icône : favicon officiel du dépôt upstream, épinglé sur le tag v1.1.0
# (URL testée le 30/10/2026 : HTTP 200, image/png, 27 038 octets).
icon: https://raw.githubusercontent.com/vectorize-io/hindsight/v1.1.0/hindsight-favicon.png

# Pas de capture d'écran livrée avec ce paquet : la galerie du store attend des
# fichiers versionnés dans le dossier de l'app. Vide plutôt qu'une URL non
# vérifiée (une image manquante casse l'affichage de la fiche).
gallery: []

path: ""

# Pas d'identifiants par défaut : l'API est protégée par la clé dérivée
# APP_SEED, lue via docker inspect (cf. README). Aucun mot de passe en clair
# dans ce dépôt.
defaultUsername: ""
defaultPassword: ""

# Renseignés après installation, depuis les réglages d'environnement de l'app.
# Aucune valeur secrète ici : seulement des défauts affichés à l'utilisateur.
# Le défaut RÉEL est appliqué par le compose (${VAR:-défaut}).
environment:
  - name: HINDSIGHT_API_LLM_PROVIDER
    services:
      - server
    default: "none"
    note: >-
      Fournisseur LLM (openai, anthropic, groq, mistral, gemini, ollama,
      openrouter, azure, ...). « none » = mode dégradé sans clé : l'app
      démarre, stocke et recherche, mais n'extrait pas de faits.

  - name: HINDSIGHT_API_LLM_API_KEY
    services:
      - server
    note: >-
      Clé API du fournisseur LLM. Obligatoire pour l'extraction de faits.
      Laisser vide pour rester en mode dégradé.

  - name: HINDSIGHT_API_LLM_MODEL
    services:
      - server
    default: gpt-5-mini
    note: >-
      Modèle utilisé pour l'extraction de faits et la réflexion. Doit exister
      chez le fournisseur choisi (ex. deepseek-v3, claude-sonnet-4-5).

  - name: HINDSIGHT_API_LLM_BASE_URL
    services:
      - server
    note: >-
      Facultatif. À renseigner uniquement pour un endpoint compatible OpenAI
      non standard (passerelle d'entreprise, vLLM, LiteLLM...). Vide = URL par
      défaut du fournisseur.

submitter: Edouard MIELS

# Dépôt qui héberge ce paquet (community App Store). umbrelOS s'en sert pour
# détecter les mises à jour du store.
submission: https://github.com/D0ou-TigreA/mon-umbrel-store
