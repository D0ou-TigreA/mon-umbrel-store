manifestVersion: 1
id: doud-ems-gladys
storage:
  dataRoot: data
category: automation
name: Gladys Assistant
version: "5.3.3"
tagline: Privacy-first home automation for your Umbrel

description: >-
  Gladys Assistant is an open-source, privacy-first home automation platform
  that brings your smart-home devices, scenes, dashboards and integrations
  together in one interface.


  Gladys supports a wide range of local and cloud integrations, including
  MQTT, Zigbee2MQTT, Matter, Bluetooth, cameras, energy monitoring, calendars,
  weather services and voice assistants.


  **First launch:** open Gladys from the Umbrel home screen and follow the
  browser-based setup flow to create your local account and configure your
  house.


  **Umbrel note:** the package deliberately does not mount Umbrel's Docker
  socket and does not run Watchtower. Umbrel manages the app lifecycle and
  updates. Gladys features that specifically require control of the Docker
  daemon are therefore not available in this package; the web interface and
  hardware/network integrations remain the intended use case.

developer: Pierre-Gilles Leymarie
website: https://gladysassistant.com/
dependencies: []
repo: https://github.com/GladysAssistant/Gladys
support: https://github.com/GladysAssistant/Gladys/issues

port: 9212
gallery: []
path: ""

icon: https://raw.githubusercontent.com/GladysAssistant/Gladys/master/front/src/assets/icons/android-icon-512x512.png
defaultUsername: ""
defaultPassword: ""

submitter: doud-ems
submission: ""

releaseNotes: >-
  Gladys Assistant 5.3.3 adds improvements to Zigbee2MQTT diagnostics and
  compatibility, a mobile-first dashboard and scene editor, Matter device
  handling improvements, MQTT topic matching fixes, energy and calendar fixes,
  and security dependency updates.
