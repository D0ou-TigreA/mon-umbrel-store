version: '3.7'
 
services:
  gladys:
    image: gladysassistant/gladys:v5.3.3@sha256:d431b35a5aea40e74fd9e66621e70adc538fd40e993290acf8629ccc9780fc6e
    restart: on-failure
    stop_grace_period: 1m

    # Gladys needs host networking for LAN discovery, multicast and mDNS.
    network_mode: host

    # Required by Gladys hardware integrations such as USB, Bluetooth and Matter.
    privileged: true
    cgroup: host

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    environment:
      NODE_ENV: production
      SQLITE_FILE_PATH: /var/lib/gladysassistant/gladys-production.db
      SERVER_PORT: 9212
      TZ: Europe/Paris

    volumes:
      - ${APP_DATA_DIR}/data/gladys:/var/lib/gladysassistant:rw
      - /dev:/dev
      - /run/udev:/run/udev:ro
      # Required for Bluetooth and Matter BLE pairing.
      - /run/dbus:/run/dbus:ro
