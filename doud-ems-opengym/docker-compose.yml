version: "3.7"

services:
  app_proxy:
    environment:
      # Format : <app-id>_<service>_1
      APP_HOST: doud-ems-opengym_web_1
      APP_PORT: 80
      # L'interface web reste protégée par la connexion Umbrel.
      # L'API est ouverte pour l'app iOS (qui ne peut pas envoyer le cookie Umbrel) ;
      # elle reste protégée par l'authentification propre d'openGym.
      PROXY_AUTH_WHITELIST: "/api/*"

  api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.5
    user: "1000:1000"
    restart: on-failure
    environment:
      PORT: 3000
      DATA_DIR: /data
      TRUST_PROXY: "1"

      # Valeurs par défaut, calculées à partir du nom de l'Umbrel (ex. umbrel.local).
      # Modifiables dans Umbrel > openGym > Settings (umbrelOS 2.0).
      RP_ID: ${DEVICE_DOMAIN_NAME}
      ORIGIN: https://${DEVICE_DOMAIN_NAME}:4580
      RP_NAME: openGym

      FIRST_USER_ADMIN: "1"
      DEFAULT_LANG: fr

      # Connexion par mot de passe en secours si les passkeys refusent umbrel.local.
      # Pour la désactiver plus tard, supprime cette ligne (après avoir ajouté une passkey à ton profil).
      PASSWORD_LOGIN: "1"

      # INVITE_ONLY : à activer depuis Umbrel > openGym > Settings, après création du profil
    volumes:
      - ${APP_DATA_DIR}/data/api:/data
      - ${APP_DATA_DIR}/data/coach-auth:/coach-auth

  web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.5
    restart: on-failure
    depends_on:
      - api
    environment:
      NGINX_PORT: 80
      # Nom du conteneur API injecté par Umbrel
      BACKEND: doud-ems-opengym_api_1
      PORT: 3000
      RESOLVER: 127.0.0.11
      MEDIA_UPLOAD_MAX: 112m
