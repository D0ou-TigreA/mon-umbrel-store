manifestVersion: 1
id: edouard-opengym
category: health
name: openGym
version: "1.4.5"
tagline: Tracker de musculation open source, sans pub ni abonnement
icon: https://raw.githubusercontent.com/GITHUB_USER/umbrel-community-app-store/main/edouard-opengym/icon.png
description: >-
  ⚠️ Avant de créer ton premier profil, configure RP_ID et ORIGIN dans
  docker-compose.yml avec l'adresse HTTPS exacte utilisée pour ouvrir openGym
  (par exemple ton nom Tailscale en .ts.net). Les passkeys sont liées à ce nom.


  openGym permet de planifier des routines, d'enregistrer ses séances, de suivre
  les muscles travaillés et d'importer ses données depuis Strong, Hevy ou FitNotes.
  L'application iOS peut se connecter à ce serveur et synchroniser les séances.


  Le premier profil créé devient administrateur.
