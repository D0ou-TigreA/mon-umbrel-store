manifestVersion: 2.0
id: doud-ems-opengym
manifestVersion: 2.0
id: doud-ems-opengym
storage:
  dataRoot: data
environment:
  - name: RP_ID
    services:
      - api
    default: umbrel.local
    note: Nom d'hôte seul, sans https:// ni port. Doit correspondre à l'adresse utilisée pour ouvrir openGym. Ne le change pas après avoir créé des passkeys.
  - name: ORIGIN
    services:
      - api
    default: https://umbrel.local:4580
    note: Adresse complète utilisée pour ouvrir openGym (https://, nom d'hôte et port), sans slash final. Le nom d'hôte doit être identique à RP_ID.
name: openGym
version: "1.4.5"
tagline: Tracker de musculation open source, sans pub ni abonnement
icon: https://raw.githubusercontent.com/GITHUB_USER/GITHUB_REPO/main/doud-ems-opengym/icon.png
description: >-
  openGym permet de planifier des routines, d'enregistrer ses séances, de suivre
  les muscles travaillés et d'importer ses données depuis Strong, Hevy ou FitNotes.
  L'app iOS fonctionne hors ligne et se synchronise avec ce serveur dès qu'il est
  joignable sur le réseau local.

  Le premier profil créé devient administrateur.
releaseNotes: ""
developer: Duarte Santos
website: https://opengym.ch
dependencies: []
repo: https://github.com/DuarteSantos8/openGym
support: https://github.com/DuarteSantos8/openGym/issues
port: 4580
requiresHttps: true
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Edouard Miels
submission: https://github.com/GITHUB_USER/GITHUB_REPO
