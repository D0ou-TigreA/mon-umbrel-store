<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Fond noir arrondi -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="#0a0a0a"/>
  
  <!-- Cercle Ensō (zen) -->
  <g transform="translate(512 512)">
    <circle cx="0" cy="0" r="240" fill="none" stroke="#e8e6dc" stroke-width="60" stroke-linecap="round"
            stroke-dasharray="1380 200" transform="rotate(-25)"/>
    <!-- Léger effet de pinceau -->
    <circle cx="0" cy="0" r="240" fill="none" stroke="#b8b6ac" stroke-width="20" stroke-linecap="round"
            stroke-dasharray="1380 200" transform="rotate(-25)" opacity="0.5"/>
  </g>
