manifestVersion: 1
id: doud-ems-zennotes
name: ZenNotes
tagline: Keyboard-first Markdown notes with Vim motions
icon: https://github.com/ZenNotes/zennotes/blob/main/apps/desktop/build/icon.png?raw=true
category: Productivity
version: "2.4.0"
port: 7878
description: >-
  ZenNotes is a keyboard-first, Markdown-first notes app.
  Your notes stay as plain .md files in a vault you own.
  Modal editing, Vim motions, split panes, preview, and a
  bundled MCP server are all first-class.


  ⚠️ On first connection, you will need to paste the auth token.
  Retrieve it from the app's data folder on your Umbrel
  (~/umbrel/app-data/doud-ems-zennotes/data/auth-token)
  or from the docker-compose environment variable.
developer: ZenNotes (adibhanna)
website: https://zennotes.org
submitter: D0ou-TigreA
submission: https://github.com/D0ou-TigreA/mon-umbrel-store
repo: https://github.com/ZenNotes/zennotes
support: https://github.com/ZenNotes/zennotes/issues
gallery:
  - https://zennotes.org/images/app.png
releaseNotes: >-
  ## v2.4.0 (20 juin 2026)
  - Patterns configurables pour daily/weekly notes (folder + filename)
  - Tâches automatiquement dues à la date de la daily note
  - Vue calendrier des tâches (drag & drop, rollover, navigation Vim)
  - Mode Edit Live Preview (tables, callouts, wikilinks rendus inline)
  - Navigation Back/Forward + tabs restylés
  - ⚠️ Databases migrées vers le format dossier `.base/` (auto)
  
  ## v2.3.0 (11 juin 2026)
  - Wikilinks auto-update au renommage
  - Mode database keyboard-driven
  - Navigation pickers Ctrl+J / Ctrl+K
  
  ## v2.2.0 (10 juin 2026)
  - Version initiale packagée pour Umbrel
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
