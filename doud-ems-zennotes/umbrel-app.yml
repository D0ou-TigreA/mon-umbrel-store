manifestVersion: 1
id: doud-ems-zennotes
name: ZenNotes
tagline: Keyboard-first Markdown notes with Vim motions
icon: https://github.com/ZenNotes/zennotes/blob/main/apps/desktop/build/icon.png?raw=true
category: Productivity
version: "2.91.0"
port: 7878
description: >-
  ZenNotes is a keyboard-first, Markdown-first notes app.
  Your notes stay as plain .md files in a vault you own.
  Modal editing, Vim motions, split panes, preview, and a
  bundled MCP server are all first-class.


  ⚠️ On first connection, you will need to paste the auth token.
  The token is APP_SEED, the per-app secret umbrelOS derives from its
  installation seed and injects as ZENNOTES_AUTH_TOKEN. It is not
  written to disk anywhere inside the app, so there is no
  data/auth-token file to read. To read it on your Umbrel:

  docker inspect doud-ems-zennotes_server_1 --format
  '{{range .Config.Env}}{{println .}}{{end}}' | grep ZENNOTES_AUTH_TOKEN

  It normally stays the same across app restarts and updates. A
  reinstall (uninstall, then install again) creates a new one, so read
  it again after a fresh install. Paste it exactly, with no trailing
  space or newline: a wrong token is simply rejected with a 401 and no
  message explaining why.
developer: ZenNotes (adibhanna)
website: https://zennotes.org
submitter: D0ou-TigreA
submission: https://github.com/D0ou-TigreA/mon-umbrel-store
repo: https://github.com/ZenNotes/zennotes
support: https://github.com/ZenNotes/zennotes/issues
gallery:
  - https://zennotes.org/images/app.png
releaseNotes: >-
  ## v2.91.0 (23 novembre 2026)
  Notes reprises des releases amont `v2.91.0` et `znserver v2.91.0`. Les
  changements marqués « poste de travail » ne concernent que les applications
  natives (macOS/Windows/Linux) ou iOS/Android, pas ce serveur.

  - Serveur : une lecture ou une écriture de note renvoie le `sha256` de la note,
    et une écriture peut renvoyer cette valeur en `baseSha256`. Si la note a
    changé entre-temps, le serveur répond 409 et n'écrit rien. Nouvelle capacité
    `supportsConditionalNoteWrites` (visible sur `/api/capabilities`).
  - Serveur : après un changement de vault, le guetteur de fichiers classe
    désormais les changements selon la configuration du nouveau vault (et non
    les noms de dossiers par défaut) ; un blocage au changement de vault sous
    Windows est corrigé.
  - Serveur : le client web embarqué passe à 2.91.0 (paquet
    `web-2.91.0-web.hac90318bc29e477e`).
  - Poste de travail : une note modifiée alors que le serveur est injoignable
    affiche « Not saved », se réenregistre seule et ne recouvre pas la version
    d'un autre appareil (la version du serveur est conservée à côté sous
    « Note (server copy) »).
  - Poste de travail : « Install for OpenCode » ne réécrit plus tout
    `opencode.json` ; « Connect to Remote Vault » en échec ne bloque plus le
    champ d'adresse sous Windows.

  ## v2.90.0 (20 novembre 2026)
  - Client web / rendu : KaTeX passe en 0.19.1 (correctif de sécurité
    GHSA-238p-pmpm-9mq7). Les formules s'affichent à l'identique.
  - Poste de travail (Windows) : une note recréée sous le nom d'une note
    supprimée récupère sa propre date de création.

  ## v2.89.0 (20 novembre 2026)
  - Serveur et image Docker : inchangés par rapport à 2.84.1 (annoncé tel quel
    en amont).
  - Poste de travail : en-têtes supplémentaires (`CF-Access-Client-Id` /
    `-Secret`, ou tout autre en-tête) pour atteindre un serveur auto-hébergé
    derrière Cloudflare Access ou un autre portail ; côté CLI/MCP via
    `ZENNOTES_REMOTE_HEADERS`.

  ## v2.88.0 (19 novembre 2026)
  - Poste de travail : un dessin créé à la racine d'un vault qui garde ses notes
    à la racine ne disparaît plus de l'application au redémarrage.
  - Serveur : inchangé.

  ## v2.87.0 (18 novembre 2026)
  - Client web : export PDF — la taille de police d'export séparée est suivie
    par l'export du client web aussi.
  - Client web : les liens de PDF continuent de s'ouvrir à leur page (le
    marquage de ligne et « Copy link » restent réservés au poste de travail).
  - Poste de travail : liens PDF vers une page/zoom, marquage de la ligne
    d'arrivée, dessins Excalidraw dans les exports Word, `:set wrap` en Vim.
  - Correction : l'id de bloc d'une tâche récurrente reste sur la tâche ouverte ;
    les titres de tâches n'affichent plus le marqueur `^id`.

  ## v2.86.0 (16 novembre 2026)
  - Client web et poste de travail : un dessin Excalidraw apparaît enfin dans un
    export PDF (l'export attend la fin du rendu des dessins).
  - Client web et poste de travail : un tableau indenté sous une puce s'affiche
    correctement en mode Édition et garde son indentation à l'enregistrement ;
    `Mod+A` dans une cellule sélectionne la cellule.
  - (le serveur 2.84.1 publié ce jour-là est le correctif `/.well-known/` déjà
    présent dans la version précédente de ce store)

  ## v2.85.0 (11 novembre 2026)
  - Poste de travail : ZenNotes Web Clipper (extension navigateur) pour clipper
    une page, une sélection ou des surlignages en note Markdown.
  - Serveur : inchangé.
  - Note : cette version n'apporte rien de visible depuis le client web.

  ## v2.84.1 (16 novembre 2026)
  - Correctif MCP : une URL `/.well-known/` sans fichier répond 404 au lieu de
    la page web. Certains clients MCP en HTTP bouclaient indéfiniment.
  
  ## v2.84.0 (9 novembre 2026)
  - App web : une ligne ouverte ou collée sous un titre replié va bien sous sa
    section (le titre reste replié)
  - App web : « copier le dessin en image » remarche
  - App web : un appui à côté d'un titre replié garde le curseur dessus (mobile)
  
  ## v2.83.1 (6 novembre 2026) — correctif de sécurité
  - Seules les pages de ce serveur peuvent utiliser une session navigateur :
    les écritures, suppressions, uploads et le socket de changements sont
    refusés (403) depuis un autre site (GHSA-f33v-gwvr-3j4g,
    GHSA-896c-3jmh-p7h4)
  - Un serveur loopback sans jeton ne répond qu'aux noms locaux, ou aux noms
    listés dans `ZENNOTES_ALLOWED_HOSTS`
  - Les endpoints JSON exigent `Content-Type: application/json` (415 sinon)
  
  ## v2.83.0 (5 novembre 2026)
  - MCP en HTTP sur `/mcp` pour les assistants distants, désactivé tant que
    `ZENNOTES_MCP_ENABLED` n'est pas défini
  - Un titre de note long ou invalide ne bloque plus l'API des notes
  - Uploads > 8 Mio réparés dans l'image Docker
  - Un lien de tableau échappé compte comme un lien ; les renommages le gardent
  - Durcissement : CSP `sandbox` sur `/api/assets/raw`, limite de temps sur les
    en-têtes, `GOMEMLIMIT` à 70 % de la limite mémoire du conteneur
  
  ## v2.82.1 (4 novembre 2026) — correctif de sécurité
  - Durcissement des liens symboliques dans le vault : une écriture, un
    déplacement ou un upload ne passe plus par un lien
  - Upload ou déplacement par défaut vers un dossier `assets` qui est un lien
    symbolique : réponse 400
  - L'image Docker expose un healthcheck (`/zennotes-server healthcheck`)
  
  ## v2.82.0 (3 novembre 2026)
  - App web : une nouvelle colonne Kanban peut porter une couleur (touche `C`)
  - App web : une sidebar masquée peut toujours être rouverte sans clavier
  
  ## v2.81.1 (2 novembre 2026)
  - App web : la colonne Open du tableau ne recouvre plus un nom long sur
    écran tactile
  - App web : la colonne de sélection garde sa largeur ; un tableau large
    s'ouvre sur sa première colonne
  
  ## v2.81.0 (2 novembre 2026)
  - Tâches récurrentes (@repeat:daily/weekly/monthly...) et rappels
  - Tableau Kanban par dossier, couleurs de colonnes
  - Sélecteur de dossiers dans les Settings
  - Corrections des listes à puces, dessins, affichage mobile
  
  ## v2.74.0 (23 octobre 2026)
  - Mise à jour du serveur ZenNotes vers la version 2.74.0.
  - Support du reverse proxy NetBird avec terminaison TLS.
  - Support des vaults distants depuis l'application iOS.
  - Sessions persistantes après redémarrage.
  - Proxy Umbrel conservé devant le serveur ZenNotes.
  
  ## v2.73.0 (20 octobre 2026)
  - La barre d'onglets peut servir à déplacer la fenêtre (titre bar désactivée)
  - L'app web peut aussi masquer sa title bar
  - Settings s'adapte aux écrans étroits et tablettes
  - Vim `o`/`O` prolongent correctement une quote ou un callout
  - CLI `zn` 0.9.1 (correctifs TUI)
  
  ## Versions v2.58 → v2.72 (octobre 2026)
  - Nombreuses améliorations : Atlas, databases, MCP, Vim
  - Historique complet : https://github.com/ZenNotes/zennotes/releases
  
  ## v2.57.0 (28 septembre 2026)
  - Repli (fold) sur les listes, tâches et callouts (`zc`, `zo`, `zM`, `zR`)
  - Callouts foldables style Obsidian (`> [!example]-` collapsed, `+` expanded)
  - Split mode : synchronisation stable sur les notes math-heavy
  - MCP agent suit le vault quand tu switches
  - Corrections diverses (F3 find, cursor position, Atlas)
  
  ## v2.56.0 (24 septembre 2026)
  - Convertir table Markdown en database
  - Renommer un vault sans changer le dossier
  - Raccourci ⌘⌥T pour templates
  
  ## v2.43.0 (2 septembre 2026)
  - Amélioration de la détection des mises à jour pour les installations AUR
    et tarball.
  - ZenNotes lit désormais directement le flux des releases GitHub pour
    détecter les nouvelles versions.
  - L'application indique clairement si une mise à jour est disponible ou si
    la version actuelle est déjà la dernière.
  - Pour les installations gérées par un gestionnaire de paquets, ZenNotes
    n'affiche plus de bouton d'installation afin d'éviter d'écraser les
    fichiers gérés par le système.

  Cette version conserve toutes les fonctionnalités précédentes : notes
  Markdown locales, édition Vim, aperçu, tâches, bases de données et
  intégration MCP.
  
  ## v2.13.2 (14 juillet 2026)
  - Callouts style Obsidian avec menu d'insertion (`> [!type]`)
  - Style personnalisable pour les tâches complétées (strike, gris)
  - Ouverture temporaire d'un dossier (sans en faire un vault)
  - Mode d'affichage persistant entre notes
  - Liens directs vers page/recherche dans les PDFs
  - Math LaTeX rendu en direct dans l'éditeur (KaTeX inline)
  - Corrections Vim, Excalidraw, split-view
  
  ## Versions intermédiaires v2.5 → v2.13
  - Multiples améliorations Vim, calendrier, databases
  - Nouvelles vues et raccourcis clavier
  - Corrections de bugs
  
  ## v2.4.0 (20 juin 2026)
  - Patterns configurables pour daily/weekly notes (folder + filename)
  - Tâches automatiquement dues à la date de la daily note
  - Vue calendrier des tâches (drag & drop, rollover, navigation Vim)
  - Mode Edit Live Preview (tables, callouts, wikilinks rendus inline)
  - Navigation Back/Forward + tabs restylés
  - ⚠️ Databases migrées vers le format dossier `.base/` (auto)
  
  ## v2.3.0 (11 juin 2026)
  - Wikilinks auto-update au renommage
  - Mode database keyboard-driven
  - Navigation pickers Ctrl+J / Ctrl+K
  
  ## v2.2.0 (10 juin 2026)
  - Version initiale packagée pour Umbrel
